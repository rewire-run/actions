name: setup bun
description: Install a pinned Bun toolchain and restore dependencies from the lockfile.

inputs:
  bun-version:
    description: >-
      Bun version to install. Defaults to the organization pin; callers should
      not override it except to test an upgrade.
    required: false
    default: "1.3.5"
  install:
    description: Run `bun install --frozen-lockfile` after installing Bun.
    required: false
    default: "true"
  working-directory:
    description: Directory containing the lockfile that dependencies install from.
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile
