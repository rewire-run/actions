[workspace]
name = "rewire-actions"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
channels = ["conda-forge"]

[dependencies]
actionlint = ">=1.7"
check-jsonschema = ">=0.37"
shellcheck = ">=0.11"

[tasks]
lint = "actionlint"
schema = "check-jsonschema --builtin-schema vendor.github-actions ./*/action.yml"
sanity = { depends-on = ["lint", "schema"] }
